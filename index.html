  const section=document.createElement("section");section.className="category";
  const isOpen=openCats.has(cat);
  section.innerHTML=`<button class="cathead" aria-expanded="${isOpen}"><span class="arrow">${isOpen?"⌄":"›"}</span><span class="catname">${esc(cat)}</span><span class="count">${complete}/${allCat.length} 완료</span></button>${isOpen?'<div class="catitems"></div>':""}`;
  section.querySelector(".cathead").addEventListener("click",()=>{isOpen?openCats.delete(cat):openCats.add(cat);render();});
  if(isOpen){const body=section.querySelector(".catitems");group.forEach(item=>{
   const row=document.createElement("div");row.className="item"+(item.done?" done":"");
   const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!item.done;cb.setAttribute("aria-label",item.title+" 완료");cb.addEventListener("change",()=>{item.done=cb.checked;save();render();});
   const title=document.createElement("div");title.className="item-title";title.textContent=item.title;
   const del=document.createElement("button");del.className="delete";del.textContent="×";del.title="항목 삭제";del.setAttribute("aria-label",item.title+" 삭제");del.addEventListener("click",()=>{if(confirm(`‘${item.title}’ 항목을 삭제할까?`)){items=items.filter(x=>x.id!==item.id);save();render();}});
   row.append(cb,title,del);body.append(row);
  });}
  list.append(section);
 });
}
$("search").addEventListener("input",e=>{query=e.target.value;render();});
$("categoryFilter").addEventListener("change",e=>{categoryFilter=e.target.value;render();});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;activeTab=b.dataset.tab;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render();});
$("addToggle").addEventListener("click",()=>{$("addForm").classList.toggle("show");if($("addForm").classList.contains("show"))$("newTitle").focus();});
$("addButton").addEventListener("click",()=>{const title=$("newTitle").value.trim(),category=$("newCategory").value.trim()||"기타";if(!title){$("newTitle").focus();return;}items.push({id:Date.now()+Math.random(),category,title,done:false});openCats.add(category);categoryFilter="";$("categoryFilter").value="";activeTab="all";document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.tab==="all"));$("newTitle").value="";$("newCategory").value="";$("addForm").classList.remove("show");save();render();});
$("newTitle").addEventListener("keydown",e=>{if(e.key==="Enter")$("addButton").click();});
$("expandAll").addEventListener("click",()=>{items.forEach(x=>openCats.add(x.category));render();});
$("collapseAll").addEventListener("click",()=>{openCats.clear();render();});
$("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:1,items},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="나의_버킷리스트_백업.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.items;if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x.title==="string"&&typeof x.category==="string"))throw Error();if(confirm("현재 목록을 백업 파일의 목록으로 바꿀까?")){items=arr.map((x,i)=>({id:x.id??Date.now()+i,category:x.category,title:x.title,done:!!x.done}));save();render();}}catch(err){alert("이 백업 파일을 읽을 수 없어.");}e.target.value="";});
load();render();
</script></body></html>
